name: Refresh projections and ESPN leagues
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build custom projections
        run: python scripts/refresh-projections.py
      - name: Add both ESPN leagues
        run: python scripts/augment-espn.py
        env:
          ESPN_LEAGUE_1: ${{ secrets.ESPN_LEAGUE_1 }}
          ESPN_LEAGUE_2: ${{ secrets.ESPN_LEAGUE_2 }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh projections and ESPN leagues"
          file_pattern: public/data/latest.json
